<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Accept / Reject button pairs in collapsed accordions (Sourcepoint-style)</title>
<style>
 #pm{position:fixed;inset:5%;background:#fff;border:1px solid #777;padding:16px;overflow:auto;z-index:9999}
 [hidden]{display:none!important}
 .on{outline:2px solid #2a7}
</style></head><body>
<h1>Newspaper</h1>
<div id="pm" role="dialog" aria-label="Privacy settings">
  <h2>Privacy settings</h2>
  <p>Please manage your cookie choices by switching the consent toggles on or off under the Purposes listed below.</p>
  <button id="subscribe">Reject all and subscribe</button> <button id="acceptAll">Accept all</button>
  <div id="list"></div>
  <p><button id="save">Save and close</button> <button id="cancel">Cancel</button></p>
</div>
<script>
const names = ['Store and/or access information on a device', 'Personalised advertising', 'Personalised content', 'Special purposes'];
const state = window.state = { choice: names.map(() => 'unset'), saved: false, acceptedAll: false, subscribed: false };
const list = document.getElementById('list');
names.forEach((n, i) => {
  const wrap = document.createElement('div');
  wrap.innerHTML = '<h3 role="button" tabindex="0" aria-expanded="false" class="accordion">' + n + '</h3>' +
    '<div class="body" hidden><p>Some description of the purpose.</p><button class="acc">Accept</button> <button class="rej">Reject</button></div>';
  const head = wrap.querySelector('h3'), body = wrap.querySelector('.body');
  head.onclick = () => { const open = head.getAttribute('aria-expanded') === 'true'; head.setAttribute('aria-expanded', !open); body.hidden = open; };
  wrap.querySelector('.acc').onclick = () => { state.choice[i] = 'accept'; };
  wrap.querySelector('.rej').onclick = () => { state.choice[i] = 'reject'; };
  list.appendChild(wrap);
});
document.getElementById('subscribe').onclick = () => { state.subscribed = true; };
document.getElementById('acceptAll').onclick = () => { state.acceptedAll = true; state.choice.fill('accept'); pm.hidden = true; };
document.getElementById('save').onclick = () => { state.saved = true; pm.hidden = true; };
document.getElementById('cancel').onclick = () => { pm.hidden = true; };
</script></body></html>
